[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "paralisacao-rpa"
version = "0.1.0"
description = "RPA de paralisações — OpenPort CODEBA"
requires-python = ">=3.10"
dependencies = [
    "playwright==1.49.1",
    "openpyxl==3.1.5",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=paralisacao --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = [
    "src/paralisacao/__main__.py",
    "src/paralisacao/main.py",
    "src/paralisacao/browser.py",
    "src/paralisacao/capa.py",
    "src/paralisacao/navegacao.py",
    "src/paralisacao/popup.py",
    "src/paralisacao/relatorio.py",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]
